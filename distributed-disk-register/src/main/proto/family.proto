syntax = "proto3";

package family;

option java_multiple_files = true;
option java_package = "family";
option java_outer_classname = "FamilyProto";

message NodeInfo {
  string host = 1;
  int32 port = 2;
}

message FamilyView {
  repeated NodeInfo members = 1;
}

message Empty {}

message ChatMessage {
  string text = 1;
  string fromHost = 2;
  int32 fromPort = 3;
  int64 timestamp = 4;
  map<string, int64> vectorClock = 5;
  string originNodeId = 6;
}

message ElectionMessage {
  int32 candidatePort = 1;
  string candidateHost = 2;
}

message CoordinatorMessage {
  int32 leaderPort = 1;
  string leaderHost = 2;
}

// Storage related messages
message StoredMessage {
  int32 id = 1;
  string text = 2;
}

message MessageId {
  int32 id = 1;
}

message StoreResult {
  bool success = 1;
  string message = 2;
}

service FamilyService {
  rpc Join (NodeInfo) returns (FamilyView);
  rpc GetFamily (Empty) returns (FamilyView);
  rpc ReceiveChat (ChatMessage) returns (Empty);

  rpc Election (ElectionMessage) returns (Empty);
  rpc Coordinator (CoordinatorMessage) returns (Empty);
  
  // Bidirectional streaming for real-time chat
  rpc ChatStream (stream ChatMessage) returns (stream ChatMessage);
}

// Storage service for distributed message storage
service StorageService {
  rpc Store (StoredMessage) returns (StoreResult);
  rpc Retrieve (MessageId) returns (StoredMessage);
}
